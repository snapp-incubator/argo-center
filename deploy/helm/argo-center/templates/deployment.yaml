apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-center
  labels:
    {{- include "argo-center.labels" . | nindent 4 }}
spec:
  # One replica: rollouts run in-process and SQLite lives on a ReadWriteOnce volume.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "argo-center.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argo-center.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.argo_center.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: argo-center
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- /* An empty fsGroup means "do not set one"; see values.yaml. */}}
        {{- $podSecurity := .Values.podSecurityContext }}
        {{- if not $podSecurity.fsGroup }}
        {{- $podSecurity = omit $podSecurity "fsGroup" }}
        {{- end }}
        {{- toYaml $podSecurity | nindent 8 }}
      # A rollout in progress is marked "interrupted" on restart; give requests time to finish.
      terminationGracePeriodSeconds: 30
      containers:
        - name: argo-center
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-config", "/etc/argo-center/config.yaml"]
          envFrom:
            - secretRef:
                name: {{ include "argo-center.secretName" . }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/argo-center
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: argo-center
        - name: data
          persistentVolumeClaim:
            claimName: argo-center-data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
