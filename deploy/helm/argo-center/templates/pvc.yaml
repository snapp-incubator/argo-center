apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argo-center-data
  labels:
    {{- include "argo-center.labels" . | nindent 4 }}
  annotations:
    # Keep the audit log and rollout history when the app is deleted.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
