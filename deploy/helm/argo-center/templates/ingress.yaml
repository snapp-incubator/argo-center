{{- if and .Values.ingress.enabled (eq .Values.ingress.kind "Ingress") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-center
  labels:
    {{- include "argo-center.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tlsSecret }}
  tls:
    - hosts:
        - {{ $.Values.ingress.host }}
      secretName: {{ . }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argo-center
                port:
                  number: 80
{{- end }}
