{{- if not .Values.argo_center.existingSecret }}
{{- $s := .Values.argo_center -}}
apiVersion: v1
kind: Secret
metadata:
  name: argo-center
  labels:
    {{- include "argo-center.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range .Values.config.clusters }}
  {{ include "argo-center.tokenEnv" .key }}: {{ required (printf "argo_center.argocdTokens.%s is required" .key) (get $s.argocdTokens .key) | quote }}
  {{- end }}
  {{- if not .Values.config.insecureNoAuth }}
  OIDC_CLIENT_SECRET: {{ required "argo_center.oidcClientSecret is required" $s.oidcClientSecret | quote }}
  SESSION_KEY: {{ required "argo_center.sessionKey is required (openssl rand -base64 32)" $s.sessionKey | quote }}
  {{- end }}
{{- end }}
