# Pushing a tag vX.Y.Z builds the image and pushes it to ghcr.io/<owner>/<repo>:X.Y.Z and :latest,
# then pushes the Helm chart to oci://ghcr.io/<owner>/charts/argo-center:X.Y.Z.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart="$(sed -n 's/^appVersion: "\(.*\)"/\1/p' deploy/helm/argo-center/Chart.yaml)"
          if [ "$version" != "$chart" ]; then
            echo "tag $GITHUB_REF_NAME does not match the chart's appVersion $chart"
            exit 1
          fi
          chart="$(sed -n 's/^version: \(.*\)/\1/p' deploy/helm/argo-center/Chart.yaml)"
          if [ "$version" != "$chart" ]; then
            echo "tag $GITHUB_REF_NAME does not match the chart's version $chart"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Push the Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/argo-center --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/argo-center-$VERSION.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
